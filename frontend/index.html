<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Webfonts load without blocking first paint: the stylesheet is fetched as
      print media and promoted on load. If the CDN is unreachable (offline or a
      restricted network) the page still renders immediately in the system font
      stack instead of stalling.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <noscript>
      <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deepfake Detection Platform</title>
    <meta
      name="description"
      content="Analyse images, audio and video for signs of AI manipulation and download a forensic report."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
